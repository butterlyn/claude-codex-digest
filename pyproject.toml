[project]
name = "claude-codex-digest"
version = "0.1.0"
description = "Daily digest of changes to the official Claude Code and Codex docs and websites."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
