name: daily digest

on:
  workflow_dispatch: {}

permissions:
  contents: write   # commit data/ and digests/ back
  issues: write     # open the digest issue

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so the push at the end can rebase onto anything pushed meanwhile

      - name: Check the Claude token is set
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (run 'claude setup-token' on your computer)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - uses: astral-sh/setup-uv@v6

      - name: Install the engine
        run: uv sync --frozen

      - name: Run the engine
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
        run: uv run python -m engine run --deliver

      - name: Save state and digest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data digests; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "digest $(TZ=Australia/Perth date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
